# =========================================================
# 中国居民膳食营养素参考摄入量（DRIs）与膳食指南参考值
#
# 依据：
#   《中国居民膳食营养素参考摄入量》2023 版（中国营养学会）
#   《中国居民膳食指南（2022）》（中国营养学会）
#
# 用途：给「单餐结构评估」和本地大模型提供判断依据，
#       让建议里的数字有出处，而不是凭感觉写。
#
# 说明：
#   * RNI = 推荐摄入量，AI = 适宜摄入量，UL = 可耐受最高摄入量
#   * 能量不用 DRI 表，而是用 Mifflin-St Jeor 算出的 TDEE × 餐次占比（因人而异更准）
#   * 表中为普通成人（非孕产妇、非运动员）数值，18-49 岁为主体人群
# =========================================================

_meta:
  source: 中国居民膳食营养素参考摄入量（2023版）+ 中国居民膳食指南（2022）
  version: "2026-11"

# ---------------- 餐次能量分配 ----------------
# 用户指定：早 25% / 午 40% / 晚 35%
# 加餐从午、晚各匀 5%（写成 0.10 并在代码里归一化）
meal_share:
  早餐: 0.25
  午餐: 0.40
  晚餐: 0.35
  加餐: 0.10
  rule: 早餐 25% / 午餐 40% / 晚餐 35%；加餐由午餐与晚餐各匀出 5%

# ---------------- 三大营养素 ----------------
macros:
  protein:
    # 普通成人每日蛋白质 RNI（g/d），按性别与年龄段
    rni_g_per_day:
      male:   {"18-49": 65, "50-64": 65, "65-79": 65, "80+": 65}
      female: {"18-49": 55, "50-64": 55, "65-79": 55, "80+": 55}
    # 单餐目标另按体重法校验：1.0 g/kg/d（普通成人），取两者较大值
    g_per_kg_day: 1.0
    energy_ratio: [0.10, 0.20]     # 蛋白质供能比 10%-20%
    high_quality_ratio: 0.50       # 优质蛋白应占一半以上
  fat:
    energy_ratio: [0.20, 0.30]
    saturated_max_ratio: 0.10      # 饱和脂肪 <10% 总能量
  carb:
    energy_ratio: [0.50, 0.65]
    added_sugar_max_ratio: 0.10    # 添加糖 <10% 总能量（最好 <5%）
  fiber:
    ai_g_per_day: 25               # 成人膳食纤维 AI 25 g/d
    target_range: [25, 30]

# ---------------- 单餐结构阈值 ----------------
# 这些是「单餐里应该长什么样」，由每日目标按 meal_share 折算
structure:
  veg_weight_ratio: [0.30, 0.60]      # 蔬菜（含菌藻）占本餐总重量 30% 以上
  staple_energy_ratio: [0.25, 0.55]   # 主食供能占本餐 25%-55%，>55% 偏高
  fried_energy_ratio_max: 0.30        # 油炸类供能占本餐 <30%
  sodium_mg_per_meal: 667            # 全天盐 <5g（钠 2000mg），按 1/3 匀到单餐
  protein_min_ratio_of_target: 0.80   # 单餐蛋白达目标的 80% 记「达标」
  fiber_min_ratio_of_target: 0.70
  veg_min_ratio_of_target: 0.80

# ---------------- 每日食物量（膳食指南 2022 宝塔）----------------
daily_food_g:
  谷类: [200, 300]
  全谷物和杂豆: [50, 150]
  薯类: [50, 100]
  蔬菜: [300, 500]
  深色蔬菜占蔬菜: 0.5
  水果: [200, 350]
  畜禽肉: [40, 75]
  水产品: [40, 75]
  蛋类: [40, 50]
  奶及奶制品: [300, 500]
  大豆及坚果: [25, 35]
  盐: [0, 5]
  油: [25, 30]
  饮水_ml: [1500, 1700]

# ---------------- 微量营养素 RNI / AI ----------------
# 用于「这餐的微量元素够不够」的趋势判断；单餐无法准确评估，只做方向提示
micronutrients:
  calcium_mg:      {name: 钙,    rni: 800,  unit: mg,  ul: 2000,  note: 50 岁以上 RNI 升至 1000mg}
  iron_mg:         {name: 铁,    rni: 12,   unit: mg,  ul: 42,    note: 女性 18-49 岁 RNI 18mg；素食者需增加 1.8 倍}
  zinc_mg:         {name: 锌,    rni: 12.5, unit: mg,  ul: 40,    note: 女性 RNI 7.5mg；与动物蛋白同食吸收更好}
  selenium_ug:     {name: 硒,    rni: 60,   unit: μg,  ul: 400,   note: 海产品、动物内脏含量高}
  iodine_ug:       {name: 碘,    rni: 120,  unit: μg,  ul: 600,   tracked: false, note: 主要靠碘盐与海产品，无法由菜品成分表估算}
  potassium_mg:    {name: 钾,    rni: 2000, unit: mg,  ul: null,  note: 预防慢病建议 3600mg；蔬菜水果是主要来源}
  magnesium_mg:    {name: 镁,    rni: 330,  unit: mg,  ul: null,  note: 女性 300mg；深绿色蔬菜、坚果、全谷物}
  vitamin_a_ug:    {name: 维生素A, rni: 800, unit: μgRAE, ul: 3000, note: 女性 700μgRAE；动物肝脏与深色蔬菜（β-胡萝卜素）}
  vitamin_b1_mg:   {name: 维生素B1, rni: 1.4, unit: mg, ul: null,  note: 女性 1.2mg；精白米面加工中大量损失}
  vitamin_b2_mg:   {name: 维生素B2, rni: 1.4, unit: mg, ul: null,  note: 女性 1.2mg；奶类、蛋、动物肝脏}
  vitamin_c_mg:    {name: 维生素C, rni: 100, unit: mg,  ul: 2000,  note: 促进非血红素铁吸收；久煮久炒损失大}
  vitamin_d_ug:    {name: 维生素D, rni: 10,  unit: μg,  ul: 50,    tracked: false, note: 食物来源少，主要靠日照，单餐无法评估}
  vitamin_e_mg:    {name: 维生素E, rni: 14,  unit: mg,  ul: 700,   note: 植物油、坚果}

# 按性别/年龄微调（覆盖上面的默认值）
micronutrient_overrides:
  female:
    iron_mg: 18
    zinc_mg: 7.5
    magnesium_mg: 300
    vitamin_a_ug: 700
    vitamin_b1_mg: 1.2
    vitamin_b2_mg: 1.2
  age_50_plus:
    calcium_mg: 1000
  female_age_50_plus:
    iron_mg: 10

# ---------------- 判断建议用的依据条目（写进 prompt，供模型引用）----------------
key_points:
  - 每天蔬菜 300-500g，其中深色蔬菜应占一半以上；一餐有绿叶菜比「有菜」更重要
  - 每天奶及奶制品 300-500g，是钙的第一来源；中式饮食普遍钙摄入不足
  - 每天大豆及坚果 25-35g，可提供植物蛋白与不饱和脂肪酸
  - 烹调油 25-30g/天、盐 <5g/天；中餐外卖与食堂菜普遍超标
  - 油炸食品高温产生丙烯酰胺与晚期糖基化终产物（AGEs），与慢性低度炎症相关，宜控制在每周 1-2 次
  - 加工肉制品（腊肠、培根、火腿）被 IARC 列为 1 类致癌物，建议尽量少吃
  - 维生素 C 与含铁食物同食可提高非血红素铁吸收率约 2-3 倍
  - 精白米面在加工中损失 70% 以上的 B 族维生素与膳食纤维，建议部分用全谷物/薯类替代
  - 单餐蛋白质 20-30g 可较好刺激肌肉蛋白合成，早餐尤其容易不足
  - 减重人群不宜简单「少吃」，应优先保证蛋白质与蔬菜，减少精制碳水与烹调油
