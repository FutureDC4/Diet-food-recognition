# =========================================================
# 食物营养参考表（含微量元素 + 烹调方式）
#
# 数据来源：
#   1. 《中国食物成分表》标准版 第 6 版（杨月欣 主编，北京大学医学出版社）
#      —— 基础能量与三大营养素、矿物质、维生素
#   2. USDA FoodData Central (SR Legacy / FDC 2023)
#      —— 西式与油炸类食物的对照值
#   3. 《中国居民膳食指南（2022）》与《中国居民膳食营养素参考摄入量（2023 版）》
#      —— 用于判断「该加什么」的方向，不作为单餐定量依据
#
# 重要说明：
#   * 全部数值为「每 100 g 可食部」的**成品典型值**，已按中式食堂/家常做法折算烹调用油；
#     同一道菜因用油量、勾芡、含汤量不同，实际可有 ±20% 波动；
#   * 本表用途是「估算 + 趋势判断」，不是医学营养处方；
#   * key 必须与训练时 data.yaml 的 class names 完全一致，缺一类就会漏检该类
#     （config.detection.filter_unknown_food = true 时本表同时是检测白名单）。
#
# 字段：
#   density            密度 g/cm³（体积 → 重量）
#   calories_per_100g  热量 kcal
#   protein_g / fat_g / carb_g / fiber_g   三大营养素 + 膳食纤维（g）
#   sodium_mg          钠 mg（含烹调盐，是判断「咸不咸」的关键）
#   category           膳食类别：主食 / 蔬菜 / 荤菜 / 油炸 / 加工肉 / 汤
#   cooking            烹调方式：蒸 / 煮 / 清炒 / 红烧 / 油炸 / 煎 / 干煸
#   inflammation       促炎倾向：低 / 中 / 高（依据烹调方式与加工度，非临床指标）
#   micro              微量元素（每 100 g）
#   note               一句话要点，用于生成建议时引用
# =========================================================

_meta:
  source: 中国食物成分表第6版 + USDA FDC + 中国居民膳食指南2022
  unit: per_100g_edible
  version: "2026-11"

