# =========================================================
# YOLO11s + CBAM  —— 18 类中餐菜品检测（改进版结构）
#
# 改动点：backbone 第 10 层的 C2PSA → CBAM
#   C2PSA 偏全局位置建模、参数多；CBAM 更轻（通道+空间双注意力），
#   对「菜色相近、一菜一格」的中餐餐盘更合适。
#   其余层与官方 yolo11s 完全一致，因此可以用 yolo11s.pt 迁移初始化。
#
# ⚠ 通道数是写死的：
#   ultralytics 的 parse_model 不会给自定义层注入 in_channels，也不做 width 缩放，
#   所以必须手写 SPPF 的实际输出通道。yolo11s(width=0.5, max_channels=1024)：
#     min(1024, 1024) * 0.5 = 512  ->  [512]
#   换 n 用 256、m/l/x 用 512（同时改 scales 对应行）。
# =========================================================

nc: 18
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 1, CBAM, [512]]             # 10 ← 原 C2PSA[1024] 换掉

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]        # cat backbone P4
  - [-1, 2, C3k2, [512, False]]      # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]        # cat backbone P3
  - [-1, 2, C3k2, [256, False]]      # 16 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]       # cat head P4
  - [-1, 2, C3k2, [512, False]]      # 19 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]       # cat head P5（第 10 层现在是 CBAM）
  - [-1, 2, C3k2, [1024, True]]      # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]  # Detect(P3, P4, P5)
