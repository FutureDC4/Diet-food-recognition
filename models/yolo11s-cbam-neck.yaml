# =========================================================
# YOLO11s + CBAM（Neck 输出端）—— 18 类中餐菜品检测
#
# 设计要点（方案 C）：
#   1. backbone 第 10 层 C2PSA 原样保留（上一版替换掉它导致精度下降）
#   2. Neck 全部融合、上采样完成后，在送进 Detect 之前插两个 CBAM：
#        - 层 23：从 P3(第16层) 取输入，通道 128
#        - 层 24：从 P4(第19层) 取输入，通道 256
#   3. 层 0~22 的索引与原生 yolo11s **完全一致** -> yolo11s.pt 权重可全量迁移；
#      新增的 23/24 与后移的 Detect(25) 随机初始化，符合预期。
#   4. CBAM 只喂给 Detect，不参与 neck 内部传递 —— 主路完全不受影响。
#
# ⚠ 通道数是写死的：
#   parse_model 对未知自定义模块走 `else: c2 = ch[f]`，args 原样传入、不做 width 缩放，
#   所以必须手写「缩放后」的实际通道：
#     P3: min(256, 1024) * 0.5 = 128   ->  [128, 8]
#     P4: min(512, 1024) * 0.5 = 256   ->  [256, 8]
#   第二个参数是 reduction=8（原来是 16，压得偏狠）。
#   换 n 用 64/128、m 用 256/512、l/x 用 256/512（同时改 scales 行）。
# =========================================================

nc: 18
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 1, C2PSA, [1024]]             # 10  ← 官方原样保留

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12  cat backbone P4
  - [-1, 2, C3k2, [512, False]]                 # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15  cat backbone P3
  - [-1, 2, C3k2, [256, False]]                 # 16  P3/8-small
  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 13], 1, Concat, [1]]                  # 18  cat head P4
  - [-1, 2, C3k2, [512, False]]                 # 19  P4/16-medium
  - [-1, 1, Conv, [512, 3, 2]]                  # 20
  - [[-1, 10], 1, Concat, [1]]                  # 21  cat head P5
  - [-1, 2, C3k2, [1024, True]]                 # 22  P5/32-large

  - [16, 1, CBAM, [128, 8]]                     # 23  ← 新增，P3 分支注意力
  - [19, 1, CBAM, [256, 8]]                     # 24  ← 新增，P4 分支注意力
  - [[23, 24, 22], 1, Detect, [nc]]             # 25  Detect(P3+CBAM, P4+CBAM, P5)
